services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION}
    container_name: ollama
    ports:
      - "${OLLAMA_PORT}:11434"
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST}
      - OLLAMA_NUM_THREADS=8  # Limita los hilos internos de inferencia del modelo
    volumes:
      - ${OLLAMA_DATA_PATH}:/root/.ollama
    restart: always
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 24G
        reservations:
          cpus: '2.0' 
          memory: 4G 
